body{margin:0;color:#f4ead8;font:400 1rem/1.6 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Georgia,sans-serif;line-height:1.05;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
button{font-family:inherit}
#menuBtn{position:fixed;z-index:60;left:0;transition:left .32s ease;box-shadow:0 0 0 2px var(--accent);top:50%;transform:translateY(-50%);width:42px;height:68px;border:0;border-radius:0 34px 34px 0;background:var(--ink);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;animation:blink 1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.12}}
@media (prefers-reduced-motion:reduce){#menuBtn,#ig{animation-duration:2.8s}}
body.open #menuBtn{left:min(300px,84vw)}
#menuBtn svg{transition:transform .32s ease}body.open #menuBtn svg{transform:rotate(180deg)}
#ig{-webkit-tap-highlight-color:transparent;touch-action:manipulation;position:fixed;z-index:30;right:0;top:50%;transform:translateY(-50%);width:42px;height:68px;border-radius:34px 0 0 34px;background:var(--ink);color:var(--accent);box-shadow:0 0 0 2px var(--accent);display:flex;align-items:center;justify-content:center;animation:blink 1s ease-in-out infinite}
#brand{position:fixed;z-index:20;top:0;left:0;right:0;background:rgba(8,10,20,.55);text-align:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px}
#logoImg{display:block;margin:0 auto}
#slogan{margin:6px auto 0;overflow:hidden;font:800 .95rem/1.15 "Bricolage Grotesque",sans-serif;letter-spacing:.03em}
.sr{position:absolute;left:-9999px}
#veil{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,14,30,.5);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:40}
#drawer{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(300px,84vw);background:var(--ink);color:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 70px) 24px 24px;transform:translateX(-100%);visibility:hidden;transition:transform .32s ease,visibility .32s;overflow-y:auto}
body.open #drawer{transform:none;visibility:visible}
body.open #veil{opacity:1;visibility:visible}

var L={"t-shirt":"T SHIRT","pant":"PANTS &amp; JEANS","jacket":"JACKET","tank-top":"TANK TOP","hat":"HATS","beanie":"BEANIE"};
var D=JSON.parse(document.getElementById("data").textContent),P,TOP,NEW,fs="All",fy="All";
function sync(){P=D.products;TOP=D.top;NEW=D.nw}sync();
try{if(sessionStorage.getItem("u1ok")){var dr=localStorage.getItem("u1draft");if(dr){var o=JSON.parse(dr);for(var q in o)D[q]=o[q];sync()}}}catch(e){}
function byId(i){return P.filter(function(p){return p.id===i})[0]}
function bg(p){return p.img?"url('"+p.img+"') center/cover":p.k}
function sz(x){return x==="Unica"?t("one"):x}
function Lc(c){return t(c)}
function card(p){var on=inCart(p.id);return '<article class="item"><div class="pic" style="background:'+bg(p)+'"><span>'+p.y+'</span></div><div class="info"><h3>'+p.n+'</h3><div class="meta">'+Lc(p.c)+' · '+t("size")+' '+sz(p.s)+'</div><div class="price">€'+p.p+'</div><button class="addb'+(on?' on':'')+'" data-add="'+p.id+'">'+(on?t("incart"):t("add"))+'</button></div></article>'}
function cardId(i){return card(byId(i))}
function fits(){var a=[];for(var i=1;i<=6;i++){var f=D.fits[i-1];a.push(f?'<div class="slot" style="padding:0;overflow:hidden"><img src="'+f+'" alt="Outfit '+i+'" style="width:100%;height:100%;object-fit:cover"></div>':'<div class="slot">FIT '+i+'<br>'+t("soon")+'</div>')}return a}
var SEC={"top-seller":["TOP SELLER",function(){return TOP.map(cardId)}],"something-new":["SOMETHING NEW",function(){return NEW.map(cardId)}],"outfit-idea":["OUTFIT IDEA",fits]};
function secPage(h){var s=SEC[h];return '<div class="page"><h2>'+t(h)+'</h2><div class="grid">'+s[1]().join("")+'</div><p><a class="back" href="#home">← '+t("home")+'</a></p></div>'}
function blk(tt,cards,slug){return '<section class="blk"><div class="shead"><h2>'+tt+'</h2><div class="arrows"><button aria-label="'+t("prev")+'" data-dir="-1">‹</button><button aria-label="'+t("next")+'" data-dir="1">›</button></div></div><div class="slider">'+cards.join("")+'<a class="plus" href="#'+slug+'" aria-label="'+t("seeall")+': '+tt+'"><span>+</span></a></div></section>'}
function home(){
  
  return '<h1 class="sr">UN1TY CR€W</h1>'
  +blk(t("top-seller"),TOP.map(cardId),"top-seller")+blk(t("something-new"),NEW.map(cardId),"something-new")
  +blk(t("outfit-idea"),fits(),"outfit-idea")
  +'<a class="cs" href="#chi-siamo">'+t("aboutBtn")+'</a>';
}
function about(){return '<div class="page about"><h2>'+t("about")+'</h2>'+T[lang].ab.map(function(x){return '<p>'+x+'</p>'}).join("")+'</div>'}
function clothes(cat){
  var sizes=["All","S","M","L","XL","Unica"],years=["All","1970s","1980s","1990s","2000s"];
  var list=P.filter(function(p){return(cat==="all"||p.c===cat)&&(fs==="All"||p.s===fs)&&(fy==="All"||p.y===fy)});
  return '<div class="page"><h2>'+(cat==="all"?t("filter"):Lc(cat))+'</h2><div class="bar"><div class="chips" role="group" aria-label="'+t("sizeLbl")+'">'
  +sizes.map(function(s){return '<button class="chip" data-s="'+s+'" aria-pressed="'+(s===fs)+'">'+(s==="All"?t("allSizes"):sz(s))+'</button>'}).join("")
  +'</div><label>'+t("year")+' <select id="yr">'+years.map(function(y){return '<option value="'+y+'"'+(y===fy?" selected":"")+'>'+(y==="All"?t("all"):y)+'</option>'}).join("")+'</select></label></div>'

  $("sub").onclick=go;b.querySelectorAll("input").forEach(function(i){i.onkeydown=function(e){if(e.key==="Enter")go()}})
}

var payMode=false,payM="bank",IBAN="IT97Y0366901600991356255467";
var PM=[["bank","bank","bankSub"],["paypal","PayPal"],["card","Visa / Mastercard"],["apple","Apple Pay"],["google","Google Pay"],["klarna","Klarna"],["satispay","Satispay"]];
function ibanFmt(){return IBAN.replace(/(.{4})/g,"$1 ").trim()}
function orderMsg(){var items=cart.map(byId).filter(Boolean),tot=items.reduce(function(a,p){return a+p.p},0),name=(PM.filter(function(x){return x[0]===payM})[0]||[])[1];name=payM==="bank"?t("bank"):name;
  return t("msgHead")+"\n"+items.map(function(p){return "- "+p.n+" ("+t("msgSize")+" "+sz(p.s)+") – €"+p.p}).join("\n")+"\n"+t("msgTot")+": €"+tot+"\n"+t("msgPay")+": "+name+(payM==="bank"?"\n"+t("msgBank"):"")}
function payRender(m){
  payMode=true;payM=m;$("acctT").textContent=t("payT");
  var items=cart.map(byId).filter(Boolean),tot=items.reduce(function(a,p){return a+p.p},0);
  $("acctBody").innerHTML='<p><b>'+t("total")+': €'+tot+'</b> · '+t("payChoose")+'</p>'+PM.map(function(x){var on=x[0]===m,lab=x[0]==="bank"?t("bank"):x[1],sub=x[0]==="bank"?t("bankSub"):t("payLink");return '<button class="pm'+(on?' sel':'')+'" data-pm="'+x[0]+'" aria-pressed="'+on+'"><b>'+lab+'</b><small>'+sub+'</small></button>'}).join("")
   +(m==="bank"?'<div class="ibx"><small>'+t("ibanL")+'</small><code>'+ibanFmt()+'</code><button class="chip" id="cpI">'+t("copy")+'</button><small>'+t("causale")+'</small></div>':'')
   +'<a class="obtn" id="payGo" href="https://wa.me/'+WANUM+'?text='+encodeURIComponent(orderMsg())+'" target="_blank" rel="noopener">'+t("confirm")+'</a><p class="pnote">'+t("payNote")+'</p>';
  $("acctBody").querySelectorAll("[data-pm]").forEach(function(b){b.onclick=function(){payRender(b.dataset.pm)}});
  var c=$("cpI");if(c)c.onclick=function(){function ok(){c.textContent=t("copied")}if(navigator.clipboard)navigator.clipboard.writeText(IBAN).then(ok,function(){prompt("IBAN",IBAN)});else prompt("IBAN",IBAN)}
}
function applyStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(function(e){e.innerHTML=t(e.dataset.i)});
  $("langBtn").innerHTML=flag(lang);$("langBtn").setAttribute("aria-label",t("lang"));
  document.querySelectorAll("#langMenu button").forEach(function(b){var l=b.dataset.l;b.innerHTML=flag(l)+'<span>'+LN[l]+'</span>';b.setAttribute("aria-current",l===lang)});
  $("bagBtn").setAttribute("aria-label",t("bag"));$("profBtn").setAttribute("aria-label",t("account"));$("cartX").setAttribute("aria-label","×");$("acctX").setAttribute("aria-label","×");
  $("wa").setAttribute("aria-label","WhatsApp +39 327 206 6525");
  var mb=$("menuBtn");mb.setAttribute("aria-label",document.body.classList.contains("open")?t("closeMenu"):t("openMenu"))
}
function setLang(l){lang=l;try{localStorage.setItem("u1lang",l)}catch(e){}applyStatic();var y=window.scrollY;route();window.scrollTo(0,y);renderCart();if($("acct").classList.contains("show")){if(payMode)payRender(payM);else acctRender()}closeAll()}
$("langBtn").onclick=function(e){e.stopPropagation();var o=$("langMenu").classList.toggle("show");this.setAttribute("aria-expanded",o)};
document.querySelectorAll("#langMenu button").forEach(function(b){b.onclick=function(){setLang(b.dataset.l)}});
document.addEventListener("click",function(e){if(!e.target.closest(".lw")){$("langMenu").classList.remove("show");$("langBtn").setAttribute("aria-expanded","false")}});
$("bagBtn").onclick=function(){var o=!document.body.classList.contains("cartopen");closeAll();if(o){renderCart();document.body.classList.add("cartopen")}};
$("cartX").onclick=closeAll;$("orderBtn").onclick=function(){var it=cart.map(byId).filter(Boolean);if(!it.length)return;closeAll();payRender("bank");$("acct").classList.add("show")};$("acctX").onclick=closeAll;
$("profBtn").onclick=function(){closeAll();acctRender();$("acct").classList.add("show")};
$("acct").onclick=function(e){if(e.target===this)closeAll()};
$("veil").onclick=closeAll;
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeAll()});
applyStatic();updProf();renderCart();
window.addEventListener("hashchange",route);route();
